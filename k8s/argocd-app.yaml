apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nodejs-app-dev
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/SaifRehman/nodejs-gitops.git
    targetRevision: develop
    path: environments/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: nodejs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
