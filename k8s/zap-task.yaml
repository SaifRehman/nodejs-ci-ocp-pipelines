apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: zap-scan
spec:
  params:
    - name: target-url
      type: string
      description: The URL of the application to scan
    - name: report-file
      type: string
      default: zap-report.html
      description: Name of the generated report
  workspaces:
    - name: zapws
      description: Workspace to store the ZAP report
  steps:
    - name: zap-baseline
      image: ghcr.io/zaproxy/zaproxy:stable
      script: |
        #!/bin/sh
        mkdir -p /zap/wrk
        zap-baseline.py -t "$(params.target-url)" -r "$(params.report-file)" || true
        cp /zap/wrk/$(params.report-file) $(workspaces.zapws.path)/ 2>/dev/null || echo "Report generation skipped"
        ls -la $(workspaces.zapws.path)/
        echo "ZAP DAST scan completed"
